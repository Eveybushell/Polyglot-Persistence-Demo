version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: taskdb
    ports:
      - "5433:5432"
    volumes:
      # This maps a local SQL file to automatically run when the container starts
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    restart: unless-stopped